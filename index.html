<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shrawani Kapse — Portfolio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red: #e53e3e;
    --red-bright: #fc4545;
    --red-dark: #9b1c1c;
    --red-glow: rgba(229,62,62,0.18);
    --black: #0a0a0a;
    --black-2: #111111;
    --black-3: #181818;
    --black-4: #1e1e1e;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
    --text-primary: #f7f7f7;
    --text-secondary: #a0a0a0;
    --text-muted: #606060;
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--black);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    line-height: 1.6;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--black-2); }
  ::-webkit-scrollbar-thumb { background: var(--red-dark); border-radius: 2px; }

  /* NAV */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--glass-border);
    padding: 0 clamp(1.5rem, 5vw, 4rem);
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    transition: all 0.3s ease;
  }
  .nav-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 1.25rem;
    color: var(--text-primary);
    text-decoration: none;
    letter-spacing: -0.02em;
  }
  .nav-logo span { color: var(--red-bright); }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    color: var(--text-secondary); text-decoration: none;
    font-size: 0.875rem; font-weight: 500;
    transition: color 0.2s;
    position: relative;
  }
  .nav-links a::after {
    content: '';
    position: absolute; bottom: -4px; left: 0; right: 0;
    height: 2px; background: var(--red-bright);
    transform: scaleX(0); transition: transform 0.2s;
  }
  .nav-links a:hover { color: var(--text-primary); }
  .nav-links a:hover::after { transform: scaleX(1); }
  .nav-menu-btn {
    display: none; background: none; border: none;
    color: var(--text-primary); cursor: pointer;
    font-size: 1.5rem; padding: 4px;
  }
  .nav-mobile {
    display: none; position: fixed; top: 64px; left: 0; right: 0;
    background: rgba(10,10,10,0.97); backdrop-filter: blur(12px);
    padding: 1.5rem 2rem; z-index: 99;
    border-bottom: 1px solid var(--glass-border);
    flex-direction: column; gap: 1.25rem;
  }
  .nav-mobile.open { display: flex; }
  .nav-mobile a {
    color: var(--text-secondary); text-decoration: none;
    font-size: 1rem; font-weight: 500; padding: 0.5rem 0;
    border-bottom: 1px solid var(--glass-border);
    transition: color 0.2s;
  }
  .nav-mobile a:hover { color: var(--red-bright); }

  /* SECTIONS */
  section { padding: clamp(5rem, 8vw, 8rem) clamp(1.5rem, 5vw, 4rem); }
  .section-label {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--red-bright);
    margin-bottom: 0.75rem;
  }
  .section-label::before {
    content: ''; display: block;
    width: 24px; height: 2px; background: var(--red-bright);
  }
  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2rem, 4vw, 2.75rem);
    font-weight: 700; letter-spacing: -0.03em;
    line-height: 1.15; margin-bottom: 1rem;
  }
  .section-title span { color: var(--red-bright); }

  /* GLASS CARD */
  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
  }
  .glass:hover {
    border-color: rgba(229,62,62,0.35);
    box-shadow: 0 0 32px rgba(229,62,62,0.08);
    transform: translateY(-3px);
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex; align-items: center;
    position: relative; overflow: hidden;
    padding-top: 64px;
  }
  .hero-bg {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 60% at 70% 50%, rgba(229,62,62,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 10% 80%, rgba(229,62,62,0.04) 0%, transparent 70%);
  }
  .hero-grid {
    position: absolute; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  }
  .hero-content {
    position: relative; z-index: 1;
    max-width: 900px;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: rgba(229,62,62,0.1);
    border: 1px solid rgba(229,62,62,0.3);
    border-radius: 999px;
    padding: 0.35rem 1rem;
    font-size: 0.8rem; font-weight: 500; color: #f9a8a8;
    margin-bottom: 1.75rem;
    animation: fadeInDown 0.6s ease both;
  }
  .hero-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red-bright);
    animation: pulse 2s infinite;
  }
  .hero-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.75rem, 7vw, 5.5rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    animation: fadeInUp 0.6s ease 0.1s both;
  }
  .hero-name .accent { color: var(--red-bright); }
  .hero-role {
    font-size: clamp(1.1rem, 2.5vw, 1.4rem);
    color: var(--text-secondary);
    font-weight: 400;
    margin-top: 1.25rem; margin-bottom: 1.75rem;
    animation: fadeInUp 0.6s ease 0.2s both;
    max-width: 640px;
  }
  .hero-btns {
    display: flex; flex-wrap: wrap; gap: 1rem;
    animation: fadeInUp 0.6s ease 0.3s both;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--red-bright);
    color: #fff; font-weight: 600; font-size: 0.9rem;
    padding: 0.8rem 1.75rem; border-radius: 8px;
    text-decoration: none; border: none; cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(229,62,62,0.3);
  }
  .btn-primary:hover {
    background: #c53030;
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(229,62,62,0.4);
  }
  .btn-secondary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: transparent;
    color: var(--text-primary); font-weight: 600; font-size: 0.9rem;
    padding: 0.8rem 1.75rem; border-radius: 8px;
    border: 1px solid var(--glass-border);
    text-decoration: none; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .btn-secondary:hover {
    border-color: rgba(229,62,62,0.5);
    background: rgba(229,62,62,0.06);
  }
  .hero-socials {
    display: flex; gap: 1rem; margin-top: 2.5rem;
    animation: fadeInUp 0.6s ease 0.4s both;
  }
  .social-link {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 10px; text-decoration: none;
    color: var(--text-secondary); font-size: 1.1rem;
    transition: all 0.2s;
  }
  .social-link:hover {
    color: var(--red-bright);
    border-color: rgba(229,62,62,0.4);
    background: rgba(229,62,62,0.08);
    transform: translateY(-3px);
  }
  .hero-scroll {
    position: absolute; bottom: 2rem; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    color: var(--text-muted); font-size: 0.7rem; letter-spacing: 0.1em;
    text-transform: uppercase; animation: bounce 2s infinite;
  }
  .hero-scroll-line {
    width: 1px; height: 40px;
    background: linear-gradient(to bottom, var(--red-bright), transparent);
  }

  /* ABOUT */
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem; align-items: center;
    max-width: 1100px; margin: 0 auto;
  }
  .about-photo-wrap {
    position: relative;
  }
  .about-photo {
    width: 100%;
    aspect-ratio: 4/5;
    background: var(--black-3);
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .about-photo-initials {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(5rem, 10vw, 8rem);
    font-weight: 800;
    color: var(--red-bright);
    opacity: 0.15;
    letter-spacing: -0.05em;
    user-select: none;
  }
  .about-photo-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 1.5rem;
    background: linear-gradient(to top, rgba(10,10,10,0.9) 0%, transparent 100%);
  }
  .about-photo-tag {
    display: inline-block;
    background: rgba(229,62,62,0.15);
    border: 1px solid rgba(229,62,62,0.3);
    border-radius: 999px;
    padding: 0.25rem 0.75rem;
    font-size: 0.75rem; font-weight: 600; color: #f9a8a8;
  }
  .about-accent-box {
    position: absolute; top: -16px; right: -16px;
    width: 72px; height: 72px;
    background: rgba(229,62,62,0.08);
    border: 1px solid rgba(229,62,62,0.2);
    border-radius: 12px;
    z-index: -1;
  }
  .about-accent-box-2 {
    position: absolute; bottom: -16px; left: -16px;
    width: 48px; height: 48px;
    background: rgba(229,62,62,0.05);
    border: 1px solid rgba(229,62,62,0.15);
    border-radius: 8px;
    z-index: -1;
  }
  .about-text p {
    color: var(--text-secondary);
    font-size: 1rem; line-height: 1.8;
    margin-bottom: 1.25rem;
  }
  .about-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1rem; margin-top: 2rem;
  }
  .stat-box {
    padding: 1.25rem;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.75rem; font-weight: 700;
    color: var(--red-bright);
    line-height: 1;
  }
  .stat-label {
    font-size: 0.75rem; color: var(--text-muted);
    margin-top: 0.35rem;
  }

  /* SKILLS */
  .skills-section { background: var(--black-2); }
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
    max-width: 1100px; margin: 3rem auto 0;
  }
  .skill-card {
    padding: 1.75rem;
  }
  .skill-category {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--red-bright);
    margin-bottom: 1.25rem;
  }
  .skill-item {
    margin-bottom: 1.25rem;
  }
  .skill-item:last-child { margin-bottom: 0; }
  .skill-meta {
    display: flex; justify-content: space-between;
    margin-bottom: 0.5rem;
  }
  .skill-name { font-size: 0.9rem; font-weight: 500; }
  .skill-pct { font-size: 0.8rem; color: var(--text-muted); }
  .skill-bar-bg {
    height: 6px; background: rgba(255,255,255,0.06);
    border-radius: 3px; overflow: hidden;
  }
  .skill-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red-dark), var(--red-bright));
    border-radius: 3px;
    transform: scaleX(0); transform-origin: left;
    transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .skill-bar-fill.animated { transform: scaleX(1); }

  /* PROJECTS */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.5rem;
    max-width: 1100px; margin: 3rem auto 0;
  }
  .project-card {
    padding: 0;
    overflow: hidden;
  }
  .project-card-top {
    padding: 1.75rem 1.75rem 1.25rem;
  }
  .project-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 3rem; font-weight: 800; line-height: 1;
    color: rgba(229,62,62,0.12);
    margin-bottom: 0.75rem;
    letter-spacing: -0.05em;
  }
  .project-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.1rem; font-weight: 600;
    line-height: 1.3; margin-bottom: 0.75rem;
  }
  .project-desc {
    font-size: 0.875rem; color: var(--text-secondary);
    line-height: 1.6;
  }
  .project-card-bottom {
    padding: 1rem 1.75rem;
    border-top: 1px solid var(--glass-border);
    display: flex; flex-wrap: wrap; gap: 0.5rem;
  }
  .tag {
    display: inline-block;
    background: rgba(229,62,62,0.08);
    border: 1px solid rgba(229,62,62,0.18);
    border-radius: 999px;
    padding: 0.2rem 0.65rem;
    font-size: 0.7rem; font-weight: 600;
    color: #f9a8a8; letter-spacing: 0.04em;
  }

  /* CERTIFICATES */
  .certs-section { background: var(--black-2); }
  .certs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.25rem;
    max-width: 1100px; margin: 3rem auto 0;
  }
  .cert-card {
    padding: 1.5rem;
    display: flex; gap: 1rem; align-items: flex-start;
  }
  .cert-icon {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: rgba(229,62,62,0.1);
    border: 1px solid rgba(229,62,62,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
  }
  .cert-title { font-size: 0.925rem; font-weight: 600; margin-bottom: 0.25rem; }
  .cert-issuer { font-size: 0.8rem; color: var(--text-muted); }

  /* EDUCATION */
  .edu-timeline {
    max-width: 700px; margin: 3rem auto 0;
    position: relative;
    padding-left: 2rem;
  }
  .edu-timeline::before {
    content: '';
    position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 2px;
    background: linear-gradient(to bottom, var(--red-bright), transparent);
  }
  .edu-item {
    position: relative; margin-bottom: 2.5rem;
  }
  .edu-item::before {
    content: '';
    position: absolute; left: -2.375rem; top: 6px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--red-bright);
    box-shadow: 0 0 0 3px rgba(229,62,62,0.2);
  }
  .edu-year {
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em;
    color: var(--red-bright); margin-bottom: 0.4rem;
  }
  .edu-degree {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.05rem; font-weight: 600; margin-bottom: 0.25rem;
  }
  .edu-school { font-size: 0.875rem; color: var(--text-secondary); }
  .edu-note { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }

  /* CONTACT */
  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    max-width: 1000px; margin: 3rem auto 0;
    align-items: start;
  }
  .contact-info h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem;
  }
  .contact-info p { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.7; margin-bottom: 1.5rem; }
  .contact-item {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .contact-icon {
    width: 38px; height: 38px;
    border-radius: 8px;
    background: rgba(229,62,62,0.08);
    border: 1px solid rgba(229,62,62,0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
  }
  .contact-item a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
  .contact-item a:hover { color: var(--red-bright); }
  .contact-form { display: flex; flex-direction: column; gap: 1rem; }
  .form-input {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    color: var(--text-primary);
    font-family: inherit; font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .form-input:focus { border-color: rgba(229,62,62,0.5); }
  .form-input::placeholder { color: var(--text-muted); }
  textarea.form-input { resize: vertical; min-height: 130px; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 2rem;
    border-top: 1px solid var(--glass-border);
    color: var(--text-muted); font-size: 0.85rem;
  }
  footer span { color: var(--red-bright); }

  /* ANIMATIONS */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }
  .fade-in-section {
    opacity: 0; transform: translateY(30px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .fade-in-section.visible {
    opacity: 1; transform: translateY(0);
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .nav-links { display: none; }
    .nav-menu-btn { display: flex; align-items: center; justify-content: center; }
    .about-grid { grid-template-columns: 1fr; gap: 2.5rem; }
    .contact-grid { grid-template-columns: 1fr; gap: 2.5rem; }
    .about-photo { max-height: 320px; }
    .hero-name { font-size: clamp(2.5rem, 12vw, 4rem); }
  }
  @media (max-width: 480px) {
    section { padding: 4rem 1.25rem; }
    .projects-grid { grid-template-columns: 1fr; }
    .skills-grid { grid-template-columns: 1fr; }
    .about-stats { grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .stat-num { font-size: 1.35rem; }
  }

  /* TYPEWRITER cursor */
  .typewriter::after {
    content: '|';
    color: var(--red-bright);
    animation: pulse 1s infinite;
    font-weight: 300;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const projects = [
  {

    tags: ["Python", "TensorFlow", "CNN", "Medical AI"],
  },
  {
  title: "Semantic Resume Analyzer",

/* ── HOOKS ──────────────────────────────────────── */
function useIntersection(ref, options = {}) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVisible(true); obs.disconnect(); }
    }, { threshold: 0.15, ...options });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return visible;
}

function useTypewriter(words, speed = 90, pause = 1800) {
  const [display, setDisplay] = useState('');
  const [wIdx, setWIdx] = useState(0);
  const [charIdx, setCharIdx] = useState(0);
  const [deleting, setDeleting] = useState(false);
  useEffect(() => {
    const word = words[wIdx];
    let delay = deleting ? speed / 2 : speed;
    if (!deleting && charIdx === word.length) delay = pause;
    if (deleting && charIdx === 0) delay = 300;
    const t = setTimeout(() => {
      if (!deleting && charIdx < word.length) {
        setDisplay(word.slice(0, charIdx + 1));
        setCharIdx(c => c + 1);
      } else if (!deleting && charIdx === word.length) {
        setDeleting(true);
      } else if (deleting && charIdx > 0) {
        setDisplay(word.slice(0, charIdx - 1));
        setCharIdx(c => c - 1);
      } else if (deleting && charIdx === 0) {
        setDeleting(false);
        setWIdx(i => (i + 1) % words.length);
      }
    }, delay);
    return () => clearTimeout(t);
  }, [charIdx, deleting, wIdx, words, speed, pause]);
  return display;
}

}

  const ref = useRef(null);

  );
}
